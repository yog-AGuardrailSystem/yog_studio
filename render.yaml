# Render Blueprint: New + > Blueprint > pick this repo. Free plan, Docker, one service.
services:
  - type: web
    name: yog-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: fake            # change to "gemini" and add GEMINI_API_KEY in the Render dashboard to use a real LLM
      - key: GEMINI_API_KEY
        sync: false            # set in the dashboard; never commit it
