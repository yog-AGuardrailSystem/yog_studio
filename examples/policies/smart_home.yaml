- id: sh-bedroom-evening-only
  english: The bedroom thermostat may only be changed between 8pm and 8am.
  tools_context: [set_thermostat(zone, temperature)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact hour(placeholder, 0)
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
        Zone != bedroom
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
        Zone == bedroom
        hour(now, H)
        H >= 20
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
        Zone == bedroom
        hour(now, H)
        H < 8
  scenarios:
    - {actor: agent, action: can_set_thermostat, resource: bedroom, context: ["hour(now, 21)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: bedroom, context: ["hour(now, 7)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: bedroom, context: ["hour(now, 12)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: bedroom, context: [], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: kitchen, context: ["hour(now, 12)"], expected: ALLOW}

- id: sh-unlock-only-when-home
  english: The agent may unlock a door only when someone is home.
  tools_context: [unlock_door(door_id, pin)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact occupied(placeholder, no)
    allow can_unlock_door(Actor, Door):
        role(Actor, assistant)
        occupied(home, yes)
  scenarios:
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["occupied(home, yes)"], expected: ALLOW}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["occupied(home, no)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: [], expected: DENY}

- id: sh-night-heat-cap
  english: After 10pm and before 6am the thermostat may not be set above 22 degrees.
  tools_context: [set_thermostat(zone, temperature)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact hour(placeholder, 0)
    fact arg(placeholder, placeholder, 0)
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
    deny can_set_thermostat(Actor, Zone):
        hour(now, H)
        H >= 22
        arg(set_thermostat, temperature, T)
        T > 22
    deny can_set_thermostat(Actor, Zone):
        hour(now, H)
        H < 6
        arg(set_thermostat, temperature, T)
        T > 22
  scenarios:
    - {actor: agent, action: can_set_thermostat, resource: hall, context: ["hour(now, 23)", "arg(set_thermostat, temperature, 25)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: hall, context: ["hour(now, 2)", "arg(set_thermostat, temperature, 23)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: hall, context: ["hour(now, 2)", "arg(set_thermostat, temperature, 22)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: hall, context: ["hour(now, 15)", "arg(set_thermostat, temperature, 27)"], expected: ALLOW}

- id: sh-vacation-mode
  english: While the house is in vacation mode the agent may not unlock doors or change the thermostat.
  tools_context: [unlock_door(door_id, pin), set_thermostat(zone, temperature)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact mode(placeholder, none)
    allow can_unlock_door(Actor, Door):
        role(Actor, assistant)
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
    deny can_unlock_door(Actor, Door):
        mode(house, vacation)
    deny can_set_thermostat(Actor, Zone):
        mode(house, vacation)
  scenarios:
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["mode(house, vacation)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: hall, context: ["mode(house, vacation)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["mode(house, home)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: hall, context: [], expected: ALLOW}

- id: sh-admin-valve-assistant-status
  english: Only the admin may open valves; the assistant may only read device status.
  tools_context: [open_valve(valve_id, percent), get_status(device_id)]
  source: claude-draft
  gold_yog: |
    fact role(alice, admin)
    fact role(agent, assistant)
    allow can_open_valve(Actor, Valve):
        role(Actor, admin)
    allow can_get_status(Actor, Device):
        role(Actor, admin)
    allow can_get_status(Actor, Device):
        role(Actor, assistant)
  scenarios:
    - {actor: alice, action: can_open_valve, resource: water_main, context: [], expected: ALLOW}
    - {actor: agent, action: can_open_valve, resource: water_main, context: [], expected: DENY}
    - {actor: agent, action: can_get_status, resource: front_door, context: [], expected: ALLOW}
    - {actor: stranger, action: can_get_status, resource: front_door, context: [], expected: DENY}
