# English <-> YOG pairs: smart-home tools. source: claude-draft (needs team review).
# Conventions: docs/conventions.md
- id: sh-night-lock
  english: The agent may never unlock the door between 11pm and 6am.
  tools_context: [unlock_door(door_id, pin)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact hour(placeholder, 0)
    allow can_unlock_door(Actor, Door):
        role(Actor, assistant)
    deny can_unlock_door(Actor, Door):
        hour(now, H)
        H >= 23
    deny can_unlock_door(Actor, Door):
        hour(now, H)
        H < 6
  scenarios:
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 3)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 23)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 6)"], expected: ALLOW}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 14)"], expected: ALLOW}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 22)"], expected: ALLOW}
    - {actor: stranger, action: can_unlock_door, resource: front_door, context: ["hour(now, 14)"], expected: DENY}

- id: sh-thermostat-range
  english: Thermostat must stay between 16 and 28 degrees.
  tools_context: [set_thermostat(zone, temperature)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact arg(placeholder, placeholder, 0)
    allow can_set_thermostat(Actor, Zone):
        role(Actor, assistant)
        arg(set_thermostat, temperature, T)
        T >= 16
        T <= 28
  scenarios:
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: ["arg(set_thermostat, temperature, 21)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: ["arg(set_thermostat, temperature, 16)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: ["arg(set_thermostat, temperature, 28)"], expected: ALLOW}
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: ["arg(set_thermostat, temperature, 15)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: ["arg(set_thermostat, temperature, 29)"], expected: DENY}
    - {actor: agent, action: can_set_thermostat, resource: living_room, context: [], expected: DENY}

