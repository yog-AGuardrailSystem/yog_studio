name: CI/CD

# Every PR and every push to main runs the tests.
# A push to main (i.e. a merged PR) that passes the tests then deploys to Render and smoke-tests the live site.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # superseded PR runs are cancelled; a run on main is never cancelled half-way through a deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend build (type-check + bundle)
        working-directory: frontend
        run: npm run build
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Browser-side rules evaluator tests
        working-directory: frontend
        run: npm run test:mirror

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Backend install
        working-directory: backend
        run: uv sync --extra dev
      - name: Backend tests (offline, fake LLM; builds and runs the real C lexer, gcc is on the runner)
        working-directory: backend
        run: uv run python -m pytest -q -m "not c_differential"
      - name: "C lexer vs Python reference on mutated programs (informational, a finding is reported but does not block)"
        working-directory: backend
        continue-on-error: true
        run: uv run python -m pytest -q -m c_differential

      - name: Smoke script syntax
        run: bash -n scripts/smoke.sh
      - name: Claims ledger points at real files
        run: python3 scripts/claims_check.py

  e2e:
    name: Browser tests (workbench, landing, motion, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: |
          (cd frontend && npm ci)
          (cd backend && uv sync --extra dev)
          (cd e2e && npm ci)
      - name: Start backend (offline fake LLM) and frontend
        run: |
          (cd backend && LLM_PROVIDER=fake nohup uv run python -m uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs localhost:8000/health >/dev/null && curl -fs localhost:5173 >/dev/null && break; sleep 2; done
      - name: Workbench
        working-directory: e2e
        run: node workbench.mjs
      - name: Landing and how-it-works
        working-directory: e2e
        run: node landing.mjs
      - name: Motion tour (registry target, pause control, reduced motion)
        working-directory: e2e
        run: node motion.mjs
      - name: Accessibility (axe contrast and structure)
        working-directory: e2e
        run: node axe.mjs
      - name: Agent flow (upload, rules, review, patch, device)
        working-directory: e2e
        run: node ui.mjs
      - name: Server logs on failure
        if: failure()
        run: tail -n 80 /tmp/backend.log /tmp/frontend.log

  docker:
    name: Docker image (builds the C lexer, smoke-tests the container)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t yog-studio:ci .
      - name: Start the container
        run: docker run -d --name yog -p 10000:10000 -e RENDER_GIT_COMMIT="$GITHUB_SHA" yog-studio:ci
      - name: Smoke-test the container (same script the deploy uses)
        run: bash scripts/smoke.sh http://localhost:10000 "$GITHUB_SHA" 120
      - name: The real C lexer is live in the image and agrees with the reference
        run: python3 scripts/check_c_lexer.py http://localhost:10000
      - name: Container logs on failure
        if: failure()
        run: docker logs yog

  deploy:
    name: Deploy to Render
    needs: [test, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://yog-studio.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy
        id: hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set, so nothing was deployed. See docs/DEPLOY.md (CI/CD)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped: RENDER_DEPLOY_HOOK secret not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ?ref=<sha> makes Render build exactly this commit
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null
          echo "Deploy triggered for ${GITHUB_SHA}"

      - name: Wait for the new version and smoke-test it
        if: steps.hook.outputs.skipped != 'true'
        run: bash scripts/smoke.sh "$SITE_URL" "$GITHUB_SHA" 1500

      - name: Summary
        if: steps.hook.outputs.skipped != 'true'
        run: echo "### Deployed ${GITHUB_SHA::7} to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
