# Held-out paraphrases for the retrieval evaluation (app/benchmark/retrieval_eval.py).
# Each line rewords one retrievable example. The query must find its source example WITHOUT sharing its exact words,
# which is what separates a real embedding model from keyword overlap.
#   id        = the example this paraphrase should retrieve (examples/policies/*.yaml, or team-<group> for the team file)
#   source    = claude-draft until a teammate rewrites/approves it (scripts/review_pack.py), then reviewed-by:<name>
- {id: db-readers-query, source: claude-draft, paraphrase: "Read-only users can issue queries, but dropping a table is off limits for them."}
- {id: db-never-drop, source: claude-draft, paraphrase: "Dropping tables is forbidden for everybody, yet database administrators keep the ability to query."}
