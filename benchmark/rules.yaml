# Benchmark set (30). Kept SEPARATE from examples/policies (retrieval) so retrieval cannot leak answers.
# source: claude-draft -> CLAUDE.md section 11 requires HUMAN-written rules for the final numbers: the team should
# replace/extend these. Schema = {id, english, tools_context, gold_yog, scenarios}. Conventions: docs/conventions.md
- id: bm-01
  english: Keep every door shut from midnight until 5am; the agent must not open any door in those hours.
  tools_context: [unlock_door(door_id)]
  source: claude-draft
  gold_yog: |
    fact role(agent, assistant)
    fact hour(placeholder, 0)
    allow can_unlock_door(A, D):
        role(A, assistant)
    deny can_unlock_door(A, D):
        hour(now, H)
        H < 5
  scenarios:
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 0)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 4)"], expected: DENY}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 5)"], expected: ALLOW}
    - {actor: agent, action: can_unlock_door, resource: front_door, context: ["hour(now, 18)"], expected: ALLOW}

